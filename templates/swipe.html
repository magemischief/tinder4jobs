{% extends "base.html" %}

{% block title %}Jobs · Jobhunt{% endblock %}

{% block content %}
<section class="page swipe-page">
  <div class="mobile-swipe-toolbar" aria-label="Review controls">
    <button id="mobile-filter-toggle" class="mobile-filter-toggle" type="button" aria-controls="swipe-filters" aria-expanded="false">
      <span aria-hidden="true">⚙</span> Filters <span id="mobile-queue-count" class="mobile-queue-count">0</span>
    </button>
    <button id="mobile-add-job-btn" class="mobile-add-job-btn" type="button"><span aria-hidden="true">+</span> Add job</button>
  </div>
  <!-- Filter bar — single horizontal row under the header -->
  <div id="swipe-filters" class="swipe-filters swipe-filters--sticky" role="toolbar" aria-label="Review filters">
    <span class="filter-label">Filter</span>
    <select id="location-filter" class="filter-select" aria-label="Location filter"></select>
    <select id="job-type-filter" class="filter-select" aria-label="Job type filter"></select>
    <select id="score-filter" class="filter-select" aria-label="Score filter">
      <option value="">All scores</option>
      <option value="high">High score (7–10)</option>
      <option value="medium">Medium score (4–6)</option>
      <option value="low">Low score (1–3)</option>
      <option value="unscored">Unscored</option>
    </select>
    <select id="ats-filter" class="filter-select" aria-label="Apply type filter">
      <option value="">All apply types</option>
      <option value="easy">Easy apply</option>
      <option value="ats">Uses ATS</option>
      <option value="ai">AI hiring</option>
    </select>
    <span class="queue-count" id="queue-count" aria-live="polite">0 in queue</span>
    <button id="add-job-btn" class="add-job-btn" type="button"><span aria-hidden="true">+</span> Add job</button>
  </div>

  <!-- Swipe stamps for visual feedback -->
  <div class="swipe-stamps">
    <div class="swipe-stamp swipe-stamp--like">
      <span class="stamp-icon">♥</span>
      <span class="stamp-text">LIKE</span>
    </div>
    <div class="swipe-stamp swipe-stamp--dislike">
      <span class="stamp-icon">✕</span>
      <span class="stamp-text">NOPE</span>
    </div>
    <div class="swipe-stamp swipe-stamp--unsure">
      <span class="stamp-icon">?</span>
      <span class="stamp-text">UNSURE</span>
    </div>
    <div class="swipe-stamp swipe-stamp--superdislike">
      <span class="stamp-icon">★</span>
      <span class="stamp-text">NO FIT</span>
    </div>
  </div>

  <div class="swipe-container">
    <div id="card-container" class="card-container" aria-live="polite">
      <!-- Skeleton card shown while queue loads -->
      <div id="card-skeleton" class="skeleton-card">
        <div class="skeleton-card-header">
          <div class="skeleton-badge"></div>
          <div class="skeleton-text" style="width:70%; margin-bottom:8px;"></div>
          <div class="skeleton-text" style="width:50%;"></div>
        </div>
        <div class="skeleton-card-body">
          <div class="skeleton-text" style="width:100%; margin-bottom:6px;"></div>
          <div class="skeleton-text" style="width:90%; margin-bottom:6px;"></div>
          <div class="skeleton-text" style="width:75%; margin-bottom:6px;"></div>
          <div class="skeleton-text" style="width:85%; margin-bottom:6px;"></div>
          <div class="skeleton-text" style="width:60%;"></div>
        </div>
      </div>
    </div>

    <!-- Action row: superdislike, dislike, unsure, like (left to right severity) -->
    <div class="swipe-actions">
      <button id="superdislike-btn" class="action-btn action-btn--superdislike" type="button" aria-label="Not a fit" title="Not a fit (S)">
        <span class="action-glyph" aria-hidden="true">★</span>
        <span class="action-label">No fit</span>
      </button>
      <button id="dislike-btn" class="action-btn action-btn--dislike" type="button" aria-label="Dislike job" title="Dislike (← or D)">
        <span class="action-glyph" aria-hidden="true">✕</span>
        <span class="action-label">Dislike</span>
      </button>
      <button id="unsure-btn" class="action-btn action-btn--unsure" type="button" aria-label="Unsure / Skip" title="Unsure (↑ or U)">
        <span class="action-glyph" aria-hidden="true">?</span>
        <span class="action-label">Unsure</span>
      </button>
      <button id="like-btn" class="action-btn action-btn--like" type="button" aria-label="Like job" title="Like (→ or L)">
        <span class="action-glyph" aria-hidden="true">♥</span>
        <span class="action-label">Like</span>
      </button>
      <button id="undo-btn" class="action-btn action-btn--undo" type="button" aria-label="Undo last swipe" title="Undo (Ctrl+Z / Cmd+Z)">
        <span class="action-glyph" aria-hidden="true">↶</span>
        <span class="action-label">Undo</span>
      </button>
    </div>
  </div>
</section>

<!-- Add Job Modal -->
<div id="add-job-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Add Job Manually</h2>
      <button id="add-job-cancel" class="btn btn--ghost" type="button">Cancel</button>
    </div>
    <div class="modal-body">
      <label for="add-job-title">Title</label>
      <input id="add-job-title" type="text" placeholder="Job title" required />
      <label for="add-job-company">Company</label>
      <input id="add-job-company" type="text" placeholder="Company name" required />
      <label for="add-job-link">Application Link</label>
      <input id="add-job-link" type="url" placeholder="https://example.com/apply" />
      <label for="add-job-location">Location</label>
      <input id="add-job-location" type="text" placeholder="e.g. New York, Remote, London" />
    </div>
    <footer class="modal-footer">
      <button id="add-job-submit" class="btn btn-primary" type="button">Add Job</button>
    </footer>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/swipe.js') }}"></script>
{% endblock %}
